# Production configuration — portable GPU variant of the CPU reference
# campaign (production_cpu.toml, merged in as base_config): gpu_backend "auto"
# selects the first functional backend (CUDA | AMDGPU | oneAPI | Metal).
# Case rationale: docs/src/parameters.md.
base_config = "production_cpu.toml"

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "auto"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
