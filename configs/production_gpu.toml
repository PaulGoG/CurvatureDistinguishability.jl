# GPU overlay of production_cpu.toml: first functional backend, Hessian chunk 2.
# Chunk semantics: docs/src/parameters.md.
base_config = "production_cpu.toml"

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "auto"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
# ForwardDiff Hessian chunk: 0 (full 6-parameter chunk) | 1–6; (1+c)² lanes per launch
hessian_chunk = 2
