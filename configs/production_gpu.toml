# Production configuration — GPU variant of the CPU reference campaign
# (production_cpu.toml, merged in as base_config): first functional backend,
# Hessian chunk 2. This is the portable GPU baseline for every device.
# Case rationale and the chunk choice: docs/src/parameters.md.
base_config = "production_cpu.toml"

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "auto"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
# ForwardDiff Hessian chunk (0 = full 6-parameter chunk; 1-6); 2 compiles and
# runs within every device limit met so far
hessian_chunk = 2
