# Production configuration — oneAPI GPU variant of the CPU reference campaign
# (production_cpu.toml, merged in as base_config): Intel iGPU, native FP64,
# chunked Hessian. Case rationale: docs/src/parameters.md.
base_config = "production_cpu.toml"

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "oneapi"
# ForwardDiff Hessian chunk for GPU compilers that reject the full 49-lane
# nested-dual kernel (0 = full chunk; 3 validated on Intel iGPU/IGC)
hessian_chunk = 3
