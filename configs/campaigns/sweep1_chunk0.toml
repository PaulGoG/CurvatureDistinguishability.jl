# Single-sweep overlay of ../production_cpu.toml: sweep 1 of 7,
# 'six_dimensional_diagonal_stress', Hessian chunk 0; GPU backend required, no maps.
base_config = "../production_cpu.toml"

[pipeline]
run_2d_mapping = false

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" | "oneapi"
gpu_backend = "auto"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
# ForwardDiff Hessian chunk: 0 (full 6-parameter chunk) | 1–6; (1+c)² lanes per launch
hessian_chunk = 0

[safety]
# device memory budget and the share reserved for the OS [GB], > 0
max_vram_gb = 8.0
os_vram_overhead_gb = 1.0

[[sweeps]]
name = "six_dimensional_diagonal_stress"
theta_0 = [8.0, 1.6, 15.0, 1.57, 0.6, -0.4]
u_dir = [0.0, 0.707, -0.5, 0.3, 0.4, -0.1]
