# Single-sweep overlay of benchmark_base.toml: sweep 3 of 7,
# 'unequal_amplitude_mass_time', Hessian chunk 1; GPU backend required, no maps.
base_config = "benchmark_base.toml"

[pipeline]
run_2d_mapping = false

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" | "oneapi"
gpu_backend = "auto"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
# ForwardDiff Hessian chunk: 0 (full 6-parameter chunk) | 1–6; (1+c)² lanes per launch
hessian_chunk = 1

[safety]
# device memory budget and the share reserved for the OS [GB], > 0
max_vram_gb = 8.0
os_vram_overhead_gb = 1.0

[[sweeps]]
name = "unequal_amplitude_mass_time"
theta_0 = [5.0, 4.0, 20.0, 0.0, 0.8, 0.8]
u_dir = [0.0, 1.0, 0.5, 0.0, 0.0, 0.0]
amp_ratio = 0.5
