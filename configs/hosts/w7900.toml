# Execution overlay of the CPU reference campaign (../production_cpu.toml,
# merged in as base_config) for a Ryzen 9 9950X host with an AMD Radeon PRO
# W7900 (48 GB). Identity-neutral: only [hardware] and [safety] differ, so the
# run identifier is the production campaign's.
base_config = "../production_cpu.toml"

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "amdgpu"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
max_threads = 32
# ForwardDiff Hessian chunk for GPU compilers that reject the full 49-lane
# nested-dual kernel (0 = full chunk)
hessian_chunk = 3

[safety]
# memory budgets in GB
max_vram_gb = 48.0
os_vram_overhead_gb = 2.0
