# 2PN overlay of quickstart.toml: the same sweeps and maps with the phase at
# 2PN order, fitted in whitened coordinates. Phase orders: docs/src/physics.md.
base_config = "quickstart.toml"

[physics]
# post-Newtonian order of the phase, one of: 1.5 | 2.0
phase_pn_order = 2.0

[pipeline]
# coordinates of the fit, one of: "parameters" | "whitened" ("whitened" needs
# optimizer = "ipnewton")
fit_coordinates = "whitened"
