# Maps involving the spins on the production grid at phase order 2.5, 1024 directions
# on the full circle; the comparison across phase orders: docs/src/physics.md, §2.
base_config = "../production_cpu.toml"

[pipeline]
run_1d_sweeps = false

[physics]
# post-Newtonian order of the phase, one of: 1.5 | 2.0 | 2.5 | 3.0 | 3.5 | 4.0 | 4.5
phase_pn_order = 2.5

[mapping]
# directions around the full circle before refinement (even; half is computed
# and mirrored)
n_angles = 1024

[[maps]]
name = "spin1_vs_spin2_coupling"
param_x = 5
param_y = 6
theta_0 = [5.0, 4.0, 20.0, 0.0, 0.8, 0.8]

[[maps]]
name = "spin1_vs_spin2_low_mass"
param_x = 5
param_y = 6
theta_0 = [3.0, 0.25, 25.0, 0.0, 0.9, 0.0]

[[maps]]
name = "spin1_vs_spin2_seed"
param_x = 5
param_y = 6
theta_0 = [2.0, 0.1, 20.0, 0.0, 0.7, 0.5]

[[maps]]
name = "mass_vs_spin1_twist"
param_x = 2
param_y = 5
theta_0 = [5.0, 4.0, 20.0, 0.0, 0.8, 0.8]
