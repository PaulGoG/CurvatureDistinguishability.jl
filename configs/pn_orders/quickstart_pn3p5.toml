# Quickstart at phase order 3.5, fitted in whitened coordinates; the comparison
# across phase orders: docs/src/physics.md, §2.
base_config = "../quickstart.toml"

[physics]
# post-Newtonian order of the phase, one of: 1.5 | 2.0 | 2.5 | 3.0 | 3.5 | 4.0 | 4.5
phase_pn_order = 3.5

[pipeline]
# coordinates of the fit, one of: "parameters" | "whitened" ("whitened" needs
# optimizer = "ipnewton")
fit_coordinates = "whitened"
