# Quickstart configuration — minutes-scale demonstration of the full
# pipeline on a reduced grid (not for publication numbers). Scenario
# rationale: docs/src/parameters.md.

[pipeline]
run_1d_sweeps = true
run_2d_mapping = true
# one of: "ipnewton" (box-constrained exact-Hessian interior-point Newton,
# recommended) | "lbfgs_box" (Fminbox gradient-only fallback)
optimizer = "ipnewton"
# seed for all stochastic components (multi-start perturbations)
rng_seed = 42

[pipeline.sweep_settings]
# log-spaced separations delta in [10^min_log_delta, 10^max_log_delta]
# (Fisher-normalized units: delta = 1 is one Fisher sigma along the direction)
n_deltas = 14
min_log_delta = -2.0
max_log_delta = 2.5
# max |D2_num/D2_theo - 1| of the points entering the O(delta^5) correction fit (> 0)
correction_fit_max_departure = 0.3
# discernibility threshold rho for the 1D sweeps (per-sweep override: rho_thresh)
rho_thresh = 1.0
# directions with Fisher norm below this are reported as degenerate
g_uu_degenerate = 1e-6
# optimizer starts per separation (secondary-minimum detection when > 1)
n_starts = 1
# optimizer convergence: projected-gradient norm g_tol, or relative change of
# D² between Newton steps below f_reltol (either triggers), both > 0
g_tol = 1e-10
f_reltol = 1e-8
max_iterations = 60

[grid]
# df = 1/T_obs; the [f_min, f_max] band at that resolution sets the bin count
# (~7.4k bins here). T_obs in s, frequencies in Hz.
T_obs = 4.8e5
f_min = 1.0e-3
f_max = 1.65e-2

[physics]
# chirp-mass unit in geometrised seconds (1 s ≈ 2.03e5 solar masses), > 0
mass_scale = 1.0
# coalescence-time unit [s], > 0
time_scale = 1.0e6
# luminosity-distance unit in light-seconds (1 Gpc = 1.0293e17 s), > 0
distance_scale = 1.0293e17
# symmetric mass ratio in (0, 0.25]; the heavier body carries spin1
eta = 0.2222
# source direction in the ecliptic frame [rad]: longitude in [0, 2π),
# latitude in [-π/2, π/2]
ecliptic_longitude = 3.1416
ecliptic_latitude = 0.5236
# inclination in [0, π] and polarization angle [rad] (Rosetta Stone conventions)
inclination = 0.5236
polarization = 0.7854
# constellation orbital and cartwheel phases at t = 0 [rad]
orbit_phase = 0.0
constellation_phase = 0.0
# relative width of the innermost-stable-orbit taper, > 0
cutoff_width = 0.1
# the T channel is identically zero in this model (dead compute; unsupported
# on GPU backends)
include_t_channel = false

[noise]
# Robson, Cornish & Liu (2019) noise model; coefficients default to the
# Table 1 column nearest [grid].T_obs. false = instrumental-only noise.
confusion_enabled = true

[mapping]
# directions around the full circle before refinement (even; half is computed
# and mirrored)
n_angles = 256
# adjacent-direction capped-radius ratio that triggers angular refinement
neighbor_ratio_tol = 1.25
max_refine_levels = 4
# bisection iterations locating exact prior-wall crossover vertices
# (0 disables the pass)
corner_bisect_iters = 15

[parameter_bounds]
# hard physical bounds [lower, upper] on the scaled parameters; inf allowed.
# The phase is periodic (deviations capped at +-pi) regardless of this table.
luminosity_distance = [0.0, inf]
chirp_mass = [0.0, inf]
coalescence_time = [0.0, inf]
spin1 = [-1.0, 1.0]
spin2 = [-1.0, 1.0]

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "none"
max_threads = 8
# ForwardDiff Hessian chunk for GPU compilers that reject the full 49-lane
# nested-dual kernel (0 = full chunk)
hessian_chunk = 0
# inter-stage memory maintenance: device-buffer flush + full host GC after
# every sweep/map (recommended for multi-hour campaigns)
gc_between_stages = true
# --heap-size-hint for scripts/launch_run.jl child processes, in GB (0 = none)
heap_size_hint_gb = 0.0

[safety]
# memory budgets in GB; the pipeline refuses to start (or downscales
# concurrency) beyond them
max_ram_gb = 8.0
max_vram_gb = 8.0
os_vram_overhead_gb = 2.0
# per-bin VRAM footprint of the single GPU optimization task, in bytes
bytes_per_bin_per_task_gpu = 1000

[monitoring]
# in-terminal UnicodePlots diagnostics after each completed stage (TTY only)
enabled = true
# fraction of a stage's work items between run.log progress lines, in (0, 1]
# (0 disables intra-stage progress logging)
progress_log_fraction = 0.25

[supervision]
# relaunches of a supervised run after its first attempt, integer >= 0
max_retries = 5
# consecutive attempts without a new finished work item before the blocking
# stage is abandoned, integer >= 1
max_stalled_retries = 2
# sampling period of worker progress and CPU time [s], in [0.05, 600]
poll_interval_s = 15.0
# deadline for the worker's first heartbeat [s], > 0
startup_grace_s = 1800.0
# no progress with idle CPU for this long is a hang [s], >= 4 poll_interval_s
idle_stall_s = 300.0
# no progress with busy CPU for this long ends the attempt [s], >= idle_stall_s
busy_stall_s = 7200.0
# CPU utilisation below which the worker counts as idle [cores], in (0, 1]
cpu_idle_cores = 0.05
# wait between SIGTERM and SIGKILL, and for the process to disappear [s], > 0
term_grace_s = 60.0
kill_wait_s = 120.0
# pause before a relaunch [s], >= 0
backoff_s = 30.0

# 1D sweeps and 2D maps; scenario rationale: docs/src/parameters.md

[[sweeps]]
name = "massive_binary_mass_time"
theta_0 = [3.0, 0.5, 25.0, 0.0, 0.8, 0.8]
u_dir = [0.0, 1.0, 0.5, 0.0, 0.0, 0.0]

[[sweeps]]
name = "near_degenerate_flat_spin"
theta_0 = [3.0, 0.5, 25.0, 0.0, 0.3, -0.3]
u_dir = [0.0, 0.15, 0.0, 0.0, 0.4, -0.92]

[[maps]]
name = "mass_vs_time_degeneracy"
param_x = 2
param_y = 3
theta_0 = [3.0, 0.5, 25.0, 0.0, 0.8, 0.8]

[[maps]]
name = "spin1_vs_spin2_coupling"
param_x = 5
param_y = 6
theta_0 = [3.0, 0.5, 25.0, 0.0, 0.8, 0.8]
