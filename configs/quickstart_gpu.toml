# Quickstart configuration — GPU variant: the quickstart physics on the
# first functional GPU backend (CUDA | AMDGPU | oneAPI | Metal), for
# minutes-scale smoke tests of the GPU path (not for publication numbers).
# Scenario rationale: docs/src/parameters.md.

[pipeline]
run_1d_sweeps = true
run_2d_mapping = true
# one of: "ipnewton" (box-constrained exact-Hessian interior-point Newton,
# recommended) | "lbfgs_box" (Fminbox gradient-only fallback)
optimizer = "ipnewton"
# seed for all stochastic components (multi-start perturbations)
rng_seed = 42

[pipeline.sweep_settings]
# log-spaced separations delta in [10^min_log_delta, 10^max_log_delta]
# (Fisher-normalized units)
n_deltas = 12
min_log_delta = -3.5
max_log_delta = -0.5
# discernibility threshold rho for the 1D sweeps (per-sweep override: rho_thresh)
rho_thresh = 1.0
# directions with Fisher norm below this are reported as degenerate
g_uu_degenerate = 1e-6
# optimizer starts per separation (secondary-minimum detection when > 1)
n_starts = 1
# optimizer convergence; do not tighten g_tol below ~1e-10 (numerical
# precision floor of small-separation fits — see docs)
g_tol = 1e-10
max_iterations = 60

[grid]
# df = 1/T_obs; the [f_min, f_max] band at that resolution sets the bin count
# (~7.4k bins here). T_obs in s, frequencies in Hz.
T_obs = 4.8e5
f_min = 1.0e-3
f_max = 1.65e-2

[physics]
mass_scale = 10.0
time_scale = 10000.0
amp_scale = 1e-21
eta = 0.25
amp_33_factor = 0.1
sky_theta = 1.047
sky_phi = 3.1415
inclination = 0.523
polarization = 0.785
# the T channel is identically zero in this model (dead compute; unsupported
# on GPU backends)
include_t_channel = false

[noise]
# Robson, Cornish & Liu (2019) noise model; coefficients default to the
# Table 1 column nearest [grid].T_obs. false = instrumental-only noise.
confusion_enabled = true

[mapping]
# directions around the full circle before refinement (even; half is computed
# and mirrored)
n_angles = 256
# adjacent-direction capped-radius ratio that triggers angular refinement
neighbor_ratio_tol = 1.25
max_refine_levels = 4
# bisection iterations locating exact prior-wall crossover vertices
# (0 disables the pass)
corner_bisect_iters = 15

[parameter_bounds]
# hard physical bounds [lower, upper] on the scaled parameters; inf allowed.
# The phase is periodic (deviations capped at +-pi) regardless of this table.
amplitude = [0.0, inf]
chirp_mass = [0.0, inf]
coalescence_time = [0.0, inf]
spin1 = [-1.0, 1.0]
spin2 = [-1.0, 1.0]

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "auto"
max_threads = 8
# ForwardDiff Hessian chunk for GPU compilers that reject the full 49-lane
# nested-dual kernel (0 = full chunk; 3 fits every kernel-argument limit
# encountered)
hessian_chunk = 3
# inter-stage memory maintenance: device-buffer flush + full host GC after
# every sweep/map (recommended for multi-hour campaigns)
gc_between_stages = true
# --heap-size-hint for scripts/launch_run.jl child processes, in GB (0 = none)
heap_size_hint_gb = 0.0

[safety]
# memory budgets in GB; the pipeline refuses to start (or downscales
# concurrency) beyond them
max_ram_gb = 8.0
max_vram_gb = 8.0
os_vram_overhead_gb = 2.0
# per-bin VRAM footprint of the single GPU optimization task, in bytes
bytes_per_bin_per_task_gpu = 1000

[monitoring]
# in-terminal UnicodePlots diagnostics after each completed stage (TTY only)
enabled = true
# fraction of a stage's work items between run.log progress lines, in (0, 1]
# (0 disables intra-stage progress logging)
progress_log_fraction = 0.25

# Two sweeps contrasting a well-measured and a near-degenerate direction,
# and two maps including the prior-limited spin wedge
# (docs/src/parameters.md for the physical rationale)

[[sweeps]]
name = "massive_binary_mass_time"
# chirp-rate/arrival-time direction of the reference massive binary
theta_0 = [1.0, 1.5, 200.0, 0.0, 0.8, 0.8]
u_dir = [0.0, 1.0, 0.5, 0.0, 0.0, 0.0]

[[sweeps]]
name = "near_degenerate_antisymmetric_spin"
# near-null antisymmetric-spin direction with a 15% chirp-mass admixture
theta_0 = [1.0, 1.5, 200.0, 0.0, 0.3, -0.3]
u_dir = [0.0, 0.15, 0.0, 0.0, 0.7, -0.7]

[[maps]]
name = "mass_vs_time_degeneracy"
param_x = 2
param_y = 3
theta_0 = [1.0, 1.5, 200.0, 0.0, 0.8, 0.8]

[[maps]]
name = "spin1_vs_spin2_coupling"
param_x = 5
param_y = 6
theta_0 = [1.0, 1.5, 200.0, 0.0, 0.8, 0.8]
