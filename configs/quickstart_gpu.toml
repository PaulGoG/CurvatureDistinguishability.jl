# Quickstart configuration — GPU variant of the minutes-scale demonstration
# run (quickstart.toml, merged in as base_config): first functional backend,
# Hessian chunk 2. Smoke test of the GPU path on a new host.
base_config = "quickstart.toml"

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "auto"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
# ForwardDiff Hessian chunk (0 = full 6-parameter chunk; 1-6); 2 compiles and
# runs within every device limit met so far
hessian_chunk = 2
