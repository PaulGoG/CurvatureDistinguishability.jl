# Quickstart configuration — GPU variant of the minutes-scale demonstration
# (quickstart.toml, merged in as base_config) on the first functional GPU
# backend (CUDA | AMDGPU | oneAPI | Metal), for smoke tests of the GPU path
# (not for publication numbers). Scenario rationale: docs/src/parameters.md.
base_config = "quickstart.toml"

[hardware]
# gpu_backend: one of: "none" (CPU) | "auto" | "cuda" | "amdgpu" | "metal" |
# "oneapi"; GPU backends require the matching package installed
gpu_backend = "auto"
# abort before any output when no functional GPU backend resolves (true | false)
require_gpu = true
# ForwardDiff Hessian chunk for GPU compilers that reject the full 49-lane
# nested-dual kernel (0 = full chunk; 3 fits every kernel-argument limit
# encountered)
hessian_chunk = 3
