name: Feature request
description: A model extension, a new analysis or an interface change
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change and why, and how it relates to the roadmap (docs/src/roadmap.md).
    validations:
      required: true
  - type: textarea
    id: formulation
    attributes:
      label: Formulation and references
      description: Equations, conventions and literature (DOIs) the change rests on, when applicable.
