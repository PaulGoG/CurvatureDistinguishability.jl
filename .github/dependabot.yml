# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/test"
      - "/bench"
    schedule:
      interval: "weekly"
    # standard libraries follow the Julia version; Dependabot proposes
    # meaningless bounds for them
    ignore:
      - dependency-name: "Dates"
      - dependency-name: "InteractiveUtils"
      - dependency-name: "LinearAlgebra"
      - dependency-name: "Logging"
      - dependency-name: "Printf"
      - dependency-name: "Random"
      - dependency-name: "SHA"
      - dependency-name: "Statistics"
      - dependency-name: "Test"
      - dependency-name: "TOML"
