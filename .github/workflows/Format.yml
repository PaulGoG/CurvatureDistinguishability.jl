name: Format
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: # julia-actions/cache deletes the old caches it created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # the committed .JuliaFormatter.toml is the style; the major version of
      # the formatter is fixed so that a new major cannot fail the check alone
      - name: Check formatting
        run: |
          julia -e '
            using Pkg
            Pkg.add(name = "JuliaFormatter", version = "2")
            using JuliaFormatter
            format("."; overwrite = false) || exit(1)'
