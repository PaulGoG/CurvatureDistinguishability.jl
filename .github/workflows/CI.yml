name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # '1' = current stable across the three OSes; pre-release on Linux
        # only. The Julia floor is the declared [compat] julia = "1.12".
        version: ['1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - version: 'pre'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # coverage instrumentation slows the suite substantially; harvest
          # happens on the Ubuntu/stable leg only, so only that leg pays
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - run: julia -e 'using Pkg; Pkg.add("JuliaFormatter"); using JuliaFormatter; format(".")'
      - run: git diff --exit-code
  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # build-only strict gate (warnonly = false); deploydocs/Pages is added
      # when the repository goes public (Pages sites from private repos are
      # publicly reachable on non-Enterprise plans). Until then the built
      # site is attached to each run as a private artifact.
      - run: julia docs/make.jl
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/
          retention-days: 30
